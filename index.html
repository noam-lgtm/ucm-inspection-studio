<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'self' https: http://127.0.0.1:* http://localhost:*; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Final Inspection Report generator for CNC manufacturing.">
  <meta name="theme-color" content="#2f5a1d">
  <title>UCM Inspection Studio</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/app.css">
  <link rel="stylesheet" href="src/report.css">
</head>
<body>
  <div id="appShell" class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="logo-ucm.svg" alt="UCM Technologies" width="92" height="46">
        <div class="brand-text"><strong data-t="app_name">Inspection Studio</strong><small data-t="app_sub"></small></div>
      </div>
      <div class="top-actions">
        <button type="button" class="local-indicator" id="syncIndicator" data-tab="settings"><span class="dot" id="syncDot"></span><span id="syncText"></span></button>
        <button type="button" class="btn btn-icon" data-action="help" aria-label="Help" title="Help">?</button>
      </div>
    </header>
    <div class="app-body">
      <aside class="sidebar">
        <nav class="side-nav" aria-label="Main">
          <button type="button" class="nav-btn active" data-tab="report"><span class="nav-num">01</span><span data-t="nav_report"></span></button>
          <button type="button" class="nav-btn" data-tab="products"><span class="nav-num">02</span><span data-t="nav_products"></span></button>
          <button type="button" class="nav-btn" data-tab="archive"><span class="nav-num">03</span><span data-t="nav_archive"></span></button>
          <button type="button" class="nav-btn" data-tab="settings"><span class="nav-num">04</span><span data-t="nav_settings"></span></button>
        </nav>
      </aside>
      <main id="main" class="main"></main>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <dialog id="helpDialog" class="help">
      <form method="dialog">
        <h2 data-t="help_title"></h2>
        <ol id="helpSteps"></ol>
        <p class="side-note" data-t="help_keys"></p>
        <button type="submit" class="btn btn-primary" autofocus>OK</button>
      </form>
    </dialog>
  </div>
  <div id="lockScreen" class="lock-screen" hidden>
    <form id="lockForm" class="lock-card" autocomplete="off">
      <img src="logo-ucm.svg" alt="UCM Technologies" width="120" height="60">
      <h1 data-t="lock_title"></h1>
      <p class="side-note" data-t="lock_intro"></p>
      <label for="lockKey" data-t="lock_password"></label>
      <input id="lockKey" type="password" dir="ltr" autocomplete="current-password" required minlength="8">
      <button type="submit" class="btn btn-primary btn-block" id="lockSubmit" data-t="lock_submit"></button>
      <p class="lock-error" id="lockError" role="alert"></p>
    </form>
  </div>
  <div id="measureSheet" class="measure-host" aria-hidden="true"></div>
  <div id="printSheet" class="print-only" aria-hidden="true"></div>
  <script type="module" src="src/app.js"></script>
</body>
</html>

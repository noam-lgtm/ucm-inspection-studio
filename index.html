/* UCM Inspection: deterministic calculations and template primitives. */
(function (root, factory) {
  const core = factory();
  if (typeof module === 'object' && module.exports) module.exports = core;
  if (root) root.UCMCore = core;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  // MIL-STD-105D, Table I, General Inspection Levels I / II / III.
  // Source image supplied by the owner and corroborated with MIL-STD-105D Table I.
  const sampleRows = [
    { low: 2, high: 8, codes: ['A', 'A', 'B'] },
    { low: 9, high: 15, codes: ['A', 'B', 'C'] },
    { low: 16, high: 25, codes: ['B', 'C', 'D'] },
    { low: 26, high: 50, codes: ['C', 'D', 'E'] },
    { low: 51, high: 90, codes: ['C', 'E', 'F'] },
    { low: 91, high: 150, codes: ['D', 'F', 'G'] },
    { low: 151, high: 280, codes: ['E', 'G', 'H'] },
    { low: 281, high: 500, codes: ['F', 'H', 'J'] },
    { low: 501, high: 1200, codes: ['G', 'J', 'K'] },
    { low: 1201, high: 3200, codes: ['H', 'K', 'L'] },
    { low: 3201, high: 10000, codes: ['J', 'L', 'M'] },
    { low: 10001, high: 35000, codes: ['K', 'M', 'N'] },
    { low: 35001, high: 150000, codes: ['L', 'N', 'P'] },
    { low: 150001, high: 500000, codes: ['M', 'P', 'Q'] },
    { low: 500001, high: Number.POSITIVE_INFINITY, codes: ['N', 'Q', 'R'] },
  ];
  const sampleByCode = Object.freeze({
    A: 2, B: 3, C: 5, D: 8, E: 13, F: 20, G: 32, H: 50,
    J: 80, K: 125, L: 200, M: 315, N: 500, P: 800, Q: 1250, R: 2000,
  });
  const levels = ['I', 'II', 'III'];

  function samplePlan(lotSize, level = 'II') {
    const quantity = Number(lotSize);
    if (!Number.isSafeInteger(quantity) || quantity < 1) return null;
    if (quantity === 1) return {
      lotSize: 1, level, code: null, tableSampleSize: null,
      sampleSize: 1, fullInspection: true, specialCase: true,
      note: 'Single piece: inspect the entire lot. Table I starts at lot size 2.'
    };
    const index = levels.indexOf(level);
    if (index === -1) return null;
    const row = sampleRows.find(item => quantity >= item.low && quantity <= item.high);
    if (!row) return null;
    const code = row.codes[index];
    const tableSampleSize = sampleByCode[code];
    return {
      lotSize: quantity, level, code, tableSampleSize,
      sampleSize: Math.min(quantity, tableSampleSize),
      fullInspection: quantity <= tableSampleSize,
      specialCase: false,
      note: quantity < tableSampleSize ? 'Sample size exceeds lot; inspect the entire lot.' : ''
    };
  }

  function parseNumericResult(value) {
    const str = String(value == null ? '' : value).trim().replace(/,/g, '.');
    if (!str) return null;
    const match = str.match(/^(?:[Rr\u00d8\u2300]\s*)?([+-]?(?:\d+(?:\.\d+)?|\.\d+))\s*(?:\u00b0)?$/);
    if (!match) return Number.NaN;
    return Number(match[1]);
  }

  function evaluateFeature(feature, measurement) {
    const m = measurement || {};
    if (feature.kind === 'gauge') {
      const outcome = String(m.outcome || '');
      if (!outcome) return { state: 'empty', reason: 'No gauge result entered' };
      if (outcome === 'pass') return { state: 'manual-pass', reason: 'Reported PASS; gauge judgement is manual' };
      if (outcome === 'fail') return { state: 'fail', reason: 'Reported FAIL; gauge judgement is manual' };
      return { state: 'review', reason: 'Unknown gauge outcome' };
    }
    const a = parseNumericResult(m.min);
    const b = parseNumericResult(m.max);
    if (a === null && b === null) return { state: 'empty', reason: 'No measurement entered' };
    if (a === null || b === null) return { state: 'review', reason: 'Both min and max are required' };
    if (!Number.isFinite(a) || !Number.isFinite(b)) return { state: 'review', reason: 'Measurement is not a supported number' };
    if (a > b) return { state: 'fail', reason: 'Minimum exceeds maximum' };

    // No default tolerance: unknown requirements must never silently PASS.
    const nomStr = String(feature.nominal ?? '').trim();
    const minusStr = String(feature.minus ?? '').trim();
    const plusStr = String(feature.plus ?? '').trim();
    if (!nomStr || !minusStr || !plusStr) return { state: 'review', reason: 'Nominal or tolerance is missing' };
    const nominal = Number(nomStr), minus = Number(minusStr), plus = Number(plusStr);
    if (![nominal, minus, plus].every(Number.isFinite) || minus < 0 || plus < 0) {
      return { state: 'review', reason: 'Nominal/tolerance is invalid' };
    }
    const lower = nominal - minus, upper = nominal + plus;
    if (a < lower - 1e-8 || b > upper + 1e-8) {
      return { state: 'fail', reason: 'Outside specified numeric limits', lower, upper };
    }
    // Required text may describe multiple sub-features but the numeric row
    // validates only one scalar. Never assert complete conformance.
    const composite = /[x\u00d7]/.test(String(feature.required || '')) &&
      /\d\s*\u00b0/.test(String(feature.required || ''));
    if (composite) return {
      state: 'partial', reason: 'Numeric dimension within limits; angle not verified', lower, upper
    };
    return { state: 'ok', reason: 'Measured range is inside numeric limits', lower, upper };
  }

  const headerFields = [
    { key: 'reportNo', en: 'Report No.', label: 'report_no' },
    { key: 'productionOrder', en: 'Prod. order', label: 'production_order' },
    { key: 'customer', en: 'Customer', label: 'customer' },
    { key: 'quantity', en: 'Quantity', label: 'quantity', numeric: true },
    { key: 'purchaseOrder', en: 'Purchase No.', label: 'purchase_order' },
    { key: 'catalogNo', en: 'Catalog No.', label: 'catalog_no' },
    { key: 'partNo', en: 'Part No.', label: 'part_no' },
    { key: 'partName', en: 'Part name', label: 'part_name' },
    { key: 'revision', en: 'Rev.', label: 'revision' },
    { key: 'inspector', en: 'Inspector', label: 'inspector' },
    { key: 'inspectionDate', en: 'Date', label: 'date' },
    { key: 'generalTolerance', en: 'General Tolerance', label: 'general_tolerance' },
    { key: 'aql', en: 'AQL', label: 'aql' },
    { key: 'inspectionLevel', en: 'General Inspection Level', label: 'inspection_level' },
    { key: 'accepted', en: 'Accepted Qty.', label: 'accepted', numeric: true },
    { key: 'rejected', en: 'Rejected Qty.', label: 'rejected', numeric: true },
  ];
  function newId() {
    if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  }
  function defaultTemplate() {
    return {
      id: newId(), name: 'Starter template',
      company: {
        name: 'UCM Technologies',
        tagline: 'Professional Milling, Turning and Assembly Solutions',
        footer: '11 Hidekel St., Building 15, Gav-Yam Park, Yavne | Tel: 08-9421002 | www.ucm.co.il | info@ucm.co.il',
        logo: ''
      },
      // Values are illustrative only. The original client CAD data is not public seed data.
      defaults: {
        reportNo: '', productionOrder: '', customer: '', quantity: '',
        purchaseOrder: '', catalogNo: '', partNo: '', partName: '', revision: '',
        inspector: '', inspectionDate: '', generalTolerance: '+/-0.1',
        aql: '2.5', inspectionLevel: 'II', accepted: '', rejected: ''
      },
      keep: {
        reportNo: false, productionOrder: false, customer: false, quantity: false,
        purchaseOrder: false, catalogNo: true, partNo: true, partName: true, revision: true,
        inspector: true, inspectionDate: false, generalTolerance: true,
        aql: true, inspectionLevel: true, accepted: false, rejected: false
      },
      features: [
        { id: newId(), kind: 'numeric', required: '25.00', nominal: '25', minus: '0.1', plus: '0.1', method: 'Caliper', unit: 'mm' },
        { id: newId(), kind: 'numeric', required: '10 +0.05/0', nominal: '10', minus: '0', plus: '0.05', method: 'Pins', unit: 'mm' },
        { id: newId(), kind: 'gauge', required: 'M8x1.25', nominal: '', minus: '', plus: '', method: 'Thread plug gauge', unit: '' }
      ]
    };
  }
  function localDate() {
    const now = new Date();
    return [now.getFullYear(), String(now.getMonth() + 1).padStart(2, '0'), String(now.getDate()).padStart(2, '0')].join('-');
  }
  function freshReport(template, previous) {
    const values = {};
    headerFields.forEach(({ key }) => {
      if (key === 'inspectionDate') {
        values[key] = template.keep[key] ? String(template.defaults[key] || '') : localDate();
      } else {
        values[key] = template.keep[key] ? String(template.defaults[key] ?? '') : '';
      }
    });
    // An explicit user choice to preserve quantities is not allowed on new reports.
    values.accepted = '';
    values.rejected = '';
    values.quantity = '';
    const measurements = {};
    template.features.forEach(f => { measurements[f.id] = { min: '', max: '', outcome: '' }; });
    return { header: values, measurements, remarks: '', createdAt: new Date().toISOString() };
  }
  function summary(template, report) {
    const list = template.features.map(f => evaluateFeature(f, report.measurements[f.id]));
    const counts = { total: list.length, ok: 0, fail: 0, partial: 0, review: 0, empty: 0 };
    list.forEach(x => {
      if (x.state === 'manual-pass' || x.state === 'ok') counts.ok++;
      else if (x.state === 'fail') counts.fail++;
      else if (x.state === 'partial') counts.partial++;
      else if (x.state === 'review') counts.review++;
      else counts.empty++;
    });
    return counts;
  }
  return { sampleRows, sampleByCode, levels, samplePlan, parseNumericResult, evaluateFeature,
    headerFields, newId, defaultTemplate, freshReport, summary };
});

</script>

  <script>
(function () {
  'use strict';
  const Core = window.UCMCore;
  const T = key => (window.UCM_TEXT && window.UCM_TEXT[key]) || key.replace(/_/g, ' ');
  const STORE_KEY = 'ucm.inspection.local.v1';
  const MAX_IMPORT_BYTES = 4 * 1024 * 1024;
  const main = document.getElementById('mainContent');
  const printSheet = document.getElementById('printSheet');
  const toastElement = document.getElementById('toast');
  let toastTimer;
  let saveTimer;
  let currentTab = 'report';
  let local;

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  const esc = escapeHtml;
  function attr(value) { return escapeHtml(value); }
  function currentTemplate() {
    return local.templates.find(t => t.id === local.activeId) || local.templates[0];
  }
  function fieldLabel(f) { return T(f.label); }
  function notify(message) {
    toastElement.textContent = message;
    toastElement.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastElement.classList.remove('show'), 3500);
  }
  function confirmAction(msg) { return window.confirm(msg); }
  function guardedRead() {
    const starter = Core.defaultTemplate();
    let saved;
    try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (_) { saved = null; }
    if (!saved || saved.version !== 1 || !Array.isArray(saved.templates) || !saved.templates.length) {
      return { version: 1, templates: [starter], activeId: starter.id, report: Core.freshReport(starter) };
    }
    try {
      const cleanTemplates = saved.templates.slice(0, 30).map(normalizeTemplate);
      const current = cleanTemplates.find(t => t.id === saved.activeId) || cleanTemplates[0];
      const report = normalizeReport(saved.report, current);
      return { version: 1, templates: cleanTemplates, activeId: current.id, report };
    } catch (_) {
      return { version: 1, templates: [starter], activeId: starter.id, report: Core.freshReport(starter) };
    }
  }
  function normalizeTemplate(incoming) {
    if (!incoming || typeof incoming !== 'object' || !Array.isArray(incoming.features)) throw Error('Invalid template');
    const starter = Core.defaultTemplate();
    const t = {
      id: typeof incoming.id === 'string' && incoming.id ? incoming.id.slice(0, 120) : Core.newId(),
      name: String(incoming.name || 'Untitled').slice(0, 110),
      company: { name: '', tagline: '', footer: '', logo: '' },
      defaults: { ...starter.defaults }, keep: { ...starter.keep }, features: []
    };
    for (const name of ['name', 'tagline', 'footer']) t.company[name] = String(incoming.company && incoming.company[name] || '').slice(0, 500);
    const logo = incoming.company && incoming.company.logo;
    if (typeof logo === 'string' && /^data:image\/(?:png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(logo) && logo.length < 600000) {
      t.company.logo = logo;
    }
    for (const f of Core.headerFields) {
      t.defaults[f.key] = String((incoming.defaults && incoming.defaults[f.key]) ?? starter.defaults[f.key] ?? '').slice(0, 240);
      t.keep[f.key] = Boolean(incoming.keep && incoming.keep[f.key]);
    }
    t.defaults.inspectionLevel = Core.levels.includes(t.defaults.inspectionLevel) ? t.defaults.inspectionLevel : 'II';
    t.features = incoming.features.slice(0, 200).map(item => ({
      id: typeof item.id === 'string' && item.id ? item.id.slice(0, 120) : Core.newId(),
      kind: item.kind === 'gauge' ? 'gauge' : 'numeric',
      required: String(item.required || '').slice(0, 300),
      nominal: String(item.nominal ?? '').slice(0, 35),
      minus: String(item.minus ?? '').slice(0, 35),
      plus: String(item.plus ?? '').slice(0, 35),
      method: String(item.method || '').slice(0, 200),
      unit: item.unit === 'deg' ? 'deg' : item.unit === 'mm' ? 'mm' : ''
    }));
    if (t.features.length < 1) t.features = [Core.defaultTemplate().features[0]];
    return t;
  }
  function normalizeReport(original, template) {
    const blank = Core.freshReport(template);
    if (!original || typeof original !== 'object' || !original.header) return blank;
    const header = {};
    Core.headerFields.forEach(f => {
      header[f.key] = String(original.header[f.key] ?? blank.header[f.key] ?? '').slice(0, 240);
    });
    const measurements = {};
    template.features.forEach(f => {
      const src = original.measurements && original.measurements[f.id] || {};
      measurements[f.id] = {
        min: String(src.min || '').slice(0, 80), max: String(src.max || '').slice(0, 80),
        outcome: ['pass', 'fail', ''].includes(src.outcome) ? src.outcome : ''
      };
    });
    return { header, measurements, remarks: String(original.remarks || '').slice(0, 3000), createdAt: String(original.createdAt || new Date().toISOString()) };
  }
  function persist() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(local));
      return true;
    } catch (error) {
      notify(T('storage_error'));
      return false;
    }
  }
  function persistSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(persist, 250); }
  function pill(status) {
    const dict = {
      'ok': ['pill-ok', T('within_limits')],
      'manual-pass': ['pill-ok', T('manual_pass')],
      'fail': ['pill-fail', T('out_of_limits')],
      'review': ['pill-review', T('needs_review')],
      'partial': ['pill-partial', T('partial_check')],
      'empty': ['pill-empty', T('not_measured')]
    };
    const p = dict[status] || dict.review;
    return `<span class="pill ${p[0]}">${esc(p[1])}</span>`;
  }
  function select(options, value, name, className = '') {
    return `<select name="${attr(name)}" class="${attr(className)}">` +
      options.map(([v, label]) => `<option value="${attr(v)}" ${v === value ? 'selected' : ''}>${esc(label)}</option>`).join('') + '</select>';
  }
  function labeledField(key, value, opts = {}) {
    const def = Core.headerFields.find(f => f.key === key);
    const label = fieldLabel(def);
    const locked = opts.locked;
    const opt = key === 'inspectionLevel' ?
      select(Core.levels.map(l => [l, l]), value, key, 'field-control') :
      `<input type="${key === 'inspectionDate' ? 'date' : 'text'}" ${key === 'quantity' || key === 'accepted' || key === 'rejected' ? 'inputmode="numeric"' : ''} name="${attr(key)}" value="${attr(value)}" ${locked ? 'disabled' : ''} autocomplete="off">`;
    const controller = (locked && key === 'inspectionLevel') ? opt.replace('<select ', '<select disabled ') : opt;
    return `<div class="field"><label for="h_${attr(key)}">${esc(label)}${locked ? '<span class="lock-symbol" title="Template value">&#128274;</span>' : ''}</label>${controller}</div>`;
  }
  function heading(kicker, title, description, actions = '') {
    return `<div class="content-heading"><div><div class="kicker">${esc(kicker)}</div><h1 class="page-title">${esc(title)}</h1><p class="page-description">${esc(description)}</p></div><div class="header-actions">${actions}</div></div>`;
  }
  function sampleInfo() {
    const h = local.report.header;
    return Core.samplePlan(h.quantity, h.inspectionLevel || 'II');
  }
  function renderSidebar() {
    const target = document.getElementById('sidebarTemplate');
    target.innerHTML = `<select class="sidebar-template-picker" id="quickTemplate">` +
      local.templates.map(t => `<option value="${attr(t.id)}" ${t.id === local.activeId ? 'selected' : ''}>${esc(t.name)}</option>`).join('') +
      `</select><p class="mini-note">${esc(T('template_tip'))}</p>`;
    document.querySelectorAll('[data-tab]').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === currentTab);
      b.setAttribute('aria-selected', String(b.dataset.tab === currentTab));
    });
  }
  function renderReport() {
    const template = currentTemplate();
    const h = local.report.header;
    const plan = sampleInfo();
    const state = Core.summary(template, local.report);
    const headerA = ['reportNo', 'customer', 'purchaseOrder', 'quantity', 'productionOrder', 'inspector', 'inspectionDate'];
    const headerB = ['catalogNo', 'partNo', 'partName', 'revision', 'generalTolerance', 'aql', 'inspectionLevel'];
    const rowHTML = template.features.map((f, index) => {
      const m = local.report.measurements[f.id] || { min: '', max: '', outcome: '' };
      const s = Core.evaluateFeature(f, m);
      const controls = f.kind === 'gauge' ?
        `<td colspan="2">${select([['', T('choose_result')],['pass','GO / PASS'],['fail','NO-GO / FAIL']], m.outcome, 'gauge_' + f.id, 'row-outcome')}</td>` :
        `<td><input aria-label="Minimum result row ${index + 1}" type="text" inputmode="decimal" data-measure="min" data-id="${attr(f.id)}" value="${attr(m.min)}" placeholder="Min"></td><td><input aria-label="Maximum result row ${index + 1}" type="text" inputmode="decimal" data-measure="max" data-id="${attr(f.id)}" value="${attr(m.max)}" placeholder="Max"></td>`;
      return `<tr data-row="${attr(f.id)}"><td class="num">${index + 1}</td><td class="required">${esc(f.required)}<div class="kind-chip">${f.kind === 'gauge' ? esc(T('gauge')) : esc(f.unit || 'dimension')}</div></td>` +
        `<td>${esc(f.method)}</td><td>${f.kind === 'numeric' ? esc(f.minus) : '\u2014'}</td><td>${f.kind === 'numeric' ? esc(f.plus) : '\u2014'}</td>` +
        controls + `<td class="row-status" title="${attr(s.reason)}">${pill(s.state)}</td></tr>`;
    }).join('');
    const actions = `<button class="button button-outline" data-action="new-report">${esc(T('start_fresh'))}</button>` +
      `<button class="button button-primary" data-action="preview">${esc(T('review_pdf'))} &#8592;</button>`;
    main.innerHTML = heading('INSPECTION / 01', T('report_title'), T('report_intro'), actions) +
      `<div class="report-layout"><div>
        <section class="panel"><div class="panel-top"><div><h2>${esc(T('report_details'))}</h2><p class="subheading">${esc(T('report_details_note'))}</p></div><span class="pill pill-empty">${esc(T('local_draft'))}</span></div><div class="panel-inner"><div class="field-grid">` +
      headerA.map(k => labeledField(k, h[k] || '', { locked: !!template.keep[k] })).join('') +
      `</div></div></section>
        <section class="panel"><div class="panel-top"><div><h2>${esc(T('product_details'))}</h2><p class="subheading">${esc(T('product_details_note'))}</p></div><button class="text-link" data-action="template">${esc(T('edit_template'))} &#8592;</button></div><div class="panel-inner"><div class="field-grid">` +
      headerB.map(k => labeledField(k, h[k] || '', { locked: !!template.keep[k] })).join('') +
      `</div></div></section>
        <section class="panel"><div class="panel-top"><div><h2>${esc(T('measurements'))}</h2><p class="subheading">${esc(T('measure_note'))}</p></div><span class="pill pill-empty">${template.features.length} ${esc(T('features'))}</span></div>
          <div class="table-wrap"><table class="measure-table"><colgroup><col style="width:5%"><col style="width:18%"><col style="width:17%"><col style="width:7%"><col style="width:7%"><col style="width:13%"><col style="width:13%"><col style="width:20%"></colgroup><thead><tr><th>#</th><th>Required</th><th>Test / Method</th><th>TOL-</th><th>TOL+</th><th>Actual Min</th><th>Actual Max</th><th>Status</th></tr></thead><tbody>${rowHTML}</tbody></table></div>
          <div class="measure-bottom"><span class="info">${esc(T('measurement_help'))}</span><button class="button button-subtle" data-action="template">${esc(T('edit_dimensions'))}</button></div>
        </section>
        <section class="panel"><div class="panel-top"><h2>${esc(T('remarks'))}</h2></div><div class="panel-inner"><div class="field"><label>${esc(T('remarks_optional'))}</label><textarea id="remarks" placeholder="${attr(T('remarks_placeholder'))}">${esc(local.report.remarks || '')}</textarea></div></div></section>
      </div><aside class="summary-panel"><section class="panel"><div class="summary-inner">
        <div class="sample-head">${esc(T('sample_size'))}</div><div class="sample-number" id="sampleNumber">${plan ? plan.sampleSize : '\u2014'}</div>
        <p class="sample-foot" id="sampleFoot">${plan ? esc(`${T('code_letter')}: ${plan.code || '\u2014'} | ${T('level')}: ${plan.level}`) : esc(T('enter_quantity'))}</p>
        <div class="small-grid"><div class="small-stat"><b id="totalLot">${esc(h.quantity || '\u2014')}</b><small>${esc(T('lot_size'))}</small></div><div class="small-stat"><b>${esc(h.aql || '\u2014')}</b><small>${esc(T('aql_default'))}</small></div></div>
        <div style="height:1px;background:#e5ebe5;margin:19px 0 12px"></div>
        <div class="metric-line"><span>${esc(T('within_limits'))}</span><b id="countOK">${state.ok}</b></div><div class="metric-line"><span>${esc(T('out_of_limits'))}</span><b id="countFail">${state.fail}</b></div><div class="metric-line"><span>${esc(T('needs_review'))}</span><b id="countReview">${state.review + state.partial}</b></div><div class="metric-line"><span>${esc(T('not_measured'))}</span><b id="countEmpty">${state.empty}</b></div>
        <button style="margin-top:16px" class="button button-primary button-full" data-action="preview">${esc(T('review_pdf'))}</button>
      </div></section><div class="alert"><strong>${esc(T('sampling_notice_title'))}</strong>${esc(T('sampling_notice'))}</div>
      <div class="alert alert-info"><strong>${esc(T('data_notice_title'))}</strong>${esc(T('data_notice'))}</div></aside></div>`;

  function renderPrint() {

    if (plan && plan.fullInspection && !plan.specialCase) pageNotes.push('Whole-lot inspection: table sample size exceeds the lot quantity.');
    if (counts.fail) pageNotes.push('At least one row is outside its entered limits. Do not treat this document as a release decision.');
    if (counts.partial || counts.review || counts.empty) pageNotes.push('One or more characteristics are unverified, incomplete, or not measured.');

      <div class="pdf-meta"><div><strong>INSPECTOR:</strong> ${esc(h.inspector || '\u2014')}</div><div><strong>DATE:</strong> ${esc(h.inspectionDate || '\u2014')}</div><div><strong>GENERAL TOLERANCE:</strong> ${esc(h.generalTolerance || '\u2014')}</div></div>
      <div class="pdf-caption">DIMENSIONAL INSPECTION RESULTS</div><table class="pdf-table"><colgroup><col style="width:5%"><col style="width:22%"><col style="width:18%"><col style="width:7%"><col style="width:7%"><col style="width:10%"><col style="width:10%"><col style="width:21%"></colgroup><thead><tr><th>No.</th><th>Required</th><th>Test equipment / method</th><th>TOL -</th><th>TOL +</th><th>Actual Min</th><th>Actual Max</th><th>Characteristic status</th></tr></thead><tbody>${tableRows}</tbody></table>
      <div class="pdf-caption">REMARKS</div><div class="pdf-remarks">${esc(local.report.remarks || '')}</div><div class="pdf-note">${esc(pageNotes.join(' '))}</div><div class="pdf-footer">${esc(t.company.name)} | ${esc(t.company.footer)} | Generated locally in browser</div></div>`;
  }

  function updateSummaryOnly() {

    const update = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = String(v); };
    update('sampleNumber', plan ? plan.sampleSize : '\u2014');
    update('sampleFoot', plan ? `${T('code_letter')}: ${plan.code || '\u2014'} | ${T('level')}: ${plan.level}` : T('enter_quantity'));
    update('totalLot', local.report.header.quantity || '\u2014');
    update('countOK', stats.ok); update('countFail', stats.fail);
    update('countReview', stats.partial + stats.review); update('countEmpty', stats.empty);
    for (const feature of template.features) {
      const row = Array.from(document.querySelectorAll('tr[data-row]')).find(x => x.dataset.row === feature.id);
      if (row) {
        const s = Core.evaluateFeature(feature, local.report.measurements[feature.id]);

  function clickAction(action, button) {
    if (action === 'report' || action === 'template' || action === 'preview') return changeTab(action);
    if (action === 'new-report') {
      if (!confirmAction(T('confirm_new_report'))) return;
      local.report = Core.freshReport(currentTemplate()); persist(); render(); notify(T('new_report_created'));
    } else if (action === 'print') {
      renderPrint(); window.print();

      const t = currentTemplate();
      t.features.push({ id: Core.newId(), kind: 'numeric', required: '', nominal: '', minus: '', plus: '', method: '', unit: 'mm' });
      local.report.measurements[t.features[t.features.length - 1].id] = { min: '', max: '', outcome: '' };
      persist(); render(); notify(T('feature_added'));
    } else if (action === 'remove-feature') {
      const t = currentTemplate();
      if (t.features.length < 2) return notify(T('at_least_one_feature'));
      if (!confirmAction(T('confirm_remove_feature'))) return;
      t.features = t.features.filter(f => f.id !== button.dataset.id);
      delete local.report.measurements[button.dataset.id];
      persist(); render();
    } else if (action === 'clone-template') {
      if (local.templates.length >= 30) return notify(T('too_many_templates'));
      const clone = JSON.parse(JSON.stringify(currentTemplate()));
      clone.id = Core.newId(); clone.name = `${clone.name} (copy)`;
      clone.features.forEach(f => { f.id = Core.newId(); });
      local.templates.push(clone); local.activeId = clone.id;
      local.report = Core.freshReport(clone); persist(); render(); notify(T('template_duplicated'));
    } else if (action === 'delete-template') {
      if (local.templates.length === 1 || !confirmAction(T('confirm_delete_template'))) return;
      local.templates = local.templates.filter(t => t.id !== local.activeId);
      local.activeId = local.templates[0].id;

  function exportSettings() {

    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });

  async function importSettings(file) {
    if (!file || file.size > MAX_IMPORT_BYTES) return notify(T('import_invalid'));
    try {
      const data = JSON.parse(await file.text());
      if (data.format !== 'ucm-inspection-templates' || data.version !== 1 || !Array.isArray(data.templates) || data.templates.length < 1 || data.templates.length > 30) throw Error('Unexpected format');
      const clean = data.templates.map(normalizeTemplate);
      const ids = new Set();
      clean.forEach(t => { if (ids.has(t.id)) t.id = Core.newId(); ids.add(t.id); });
      if (!confirmAction(T('confirm_import'))) return;
      local.templates = clean;
      local.activeId = clean.find(t => t.id === data.activeId)?.id || clean[0].id;
      local.report = Core.freshReport(currentTemplate());
      persist(); render(); notify(T('import_success'));
    } catch (error) { notify(T('import_invalid')); }

      reader.readAsDataURL(file); target.value = ''; return;
    }
    if (currentTab === 'report' && target.name && target.name.startsWith('gauge_')) {
      const id = target.name.slice(6);
      if (local.report.measurements[id]) {
        local.report.measurements[id].outcome = target.value;
        updateSummaryOnly(); persistSoon();
      }
    }
    if (currentTab === 'template') {
      const t = currentTemplate();
      if (target.name && target.name.startsWith('keep_')) {
        const key = target.name.slice(5);
        if (Core.headerFields.some(f => f.key === key)) {
          t.keep[key] = target.checked;
          if (target.checked) local.report.header[key] = t.defaults[key];
          persist(); render();
        }
      }
      if (target.closest('[data-feature]')) {
        const f = featureFromEl(target.closest('[data-feature]').dataset.feature);
        if (f && target.name === 'f-kind') {
          f.kind = target.value === 'gauge' ? 'gauge' : 'numeric';
          local.report.measurements[f.id] = { min: '', max: '', outcome: '' };
          persist(); render();
        }
        if (f && target.name === 'f-unit') { f.unit = target.value; persistSoon(); }
      }
    }
  });
  document.addEventListener('click', event => {
    const nav = event.target.closest('[data-tab]');
    if (nav) return changeTab(nav.dataset.tab);
    const button = event.target.closest('[data-action]');
    if (button) return clickAction(button.dataset.action, button);
  });
  document.getElementById('exportButton').addEventListener('click', exportSettings);
  document.getElementById('importButton').addEventListener('click', () => document.getElementById('importFile').click());
  document.getElementById('helpButton').addEventListener('click', () => {
    window.alert(T('help_dialog'));
  });
  window.addEventListener('beforeunload', () => { clearTimeout(saveTimer); persist(); });
  local = guardedRead();
  render();
})();

</script>
</body>
</html>
